    <title>greenping</title>
    <style>
      :root{--gp1:#059669;--gp2:#10B981;--gp3:#34D399}
      #gp-splash{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:30px;background:#F4FBF8;transition:opacity .45s ease;
        font-family:'Arial Rounded MT Bold','Nunito',ui-rounded,'Helvetica Neue',Arial,sans-serif}
      @media (prefers-color-scheme:dark){#gp-splash{background:#0B1512}}
      #gp-splash.gp-hide{opacity:0;pointer-events:none}
      #gp-splash .gp-ping{position:relative;width:120px;height:120px;display:grid;place-items:center}
      #gp-splash .gp-ping span{position:absolute;inset:0;margin:auto;width:120px;height:120px;border-radius:50%;
        border:3px solid var(--gp2);opacity:0;animation:gpPing 2s cubic-bezier(0,.2,.8,1) infinite}
      #gp-splash .gp-ping span:nth-child(2){animation-delay:.5s}
      #gp-splash .gp-ping span:nth-child(3){animation-delay:1s}
      #gp-splash .gp-dot{width:34px;height:34px;border-radius:50%;
        background:linear-gradient(135deg,var(--gp3),var(--gp1));box-shadow:0 0 24px rgba(16,185,129,.55);
        animation:gpDot 2s ease-in-out infinite}
      @keyframes gpPing{0%{transform:scale(.3);opacity:.75}80%{opacity:0}100%{transform:scale(1);opacity:0}}
      @keyframes gpDot{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
      #gp-splash .gp-word{font-size:34px;font-weight:700;letter-spacing:-1px}
      #gp-splash .gp-word .a{color:var(--gp1)}
      #gp-splash .gp-word .b{color:var(--gp2)}
      @media (prefers-color-scheme:dark){#gp-splash .gp-word .a{color:#34D399}#gp-splash .gp-word .b{color:#6EE7B7}}
      #gp-splash .gp-sub{margin-top:-16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
        color:#94a3b8;font-family:ui-sans-serif,system-ui,Arial,sans-serif}
    </style>

  <body>
    <div id="gp-splash" role="status" aria-label="greenping is starting">
      <div class="gp-ping"><span></span><span></span><span></span><i class="gp-dot"></i></div>
      <div class="gp-word"><span class="a">green</span><span class="b">ping</span></div>
      <div class="gp-sub">starting up</div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var root = document.getElementById('root');
        var splash = document.getElementById('gp-splash');
        if (!root || !splash) return;
        function hide() {
          splash.classList.add('gp-hide');
          setTimeout(function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 600);
        }
        var obs = new MutationObserver(function () {
          if (root.childNodes.length > 0) { obs.disconnect(); hide(); }
        });
        obs.observe(root, { childList: true });
        setTimeout(function () { try { obs.disconnect(); } catch (e) {} hide(); }, 20000);
      })();
    </script>
  </body>
